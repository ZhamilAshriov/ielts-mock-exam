<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IELTS Computer-Delivered Mock Exam — Reading</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      background-color: #e5e7eb;
      color: #111;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: text;
    }

    /* Top Bar */
    header {
      background-color: #0b1a30;
      color: #fff;
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #e02424;
    }
    .header-info {
      font-size: 14px;
      font-weight: bold;
    }
    .timer-badge {
      font-size: 18px;
      font-weight: bold;
      background: #1f2937;
      padding: 5px 14px;
      border-radius: 4px;
      letter-spacing: 1px;
    }
    .btn-submit {
      background: #e02424;
      color: #fff;
      border: none;
      padding: 7px 15px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-submit:hover {
      background: #b91c1c;
    }

    /* Part Tabs */
    .part-bar {
      background: #fff;
      border-bottom: 1px solid #cbd5e1;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .part-btn {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid #94a3b8;
      background: #f8fafc;
      border-radius: 4px;
      cursor: pointer;
    }
    .part-btn.active {
      background: #0b1a30;
      color: #fff;
      border-color: #0b1a30;
    }

    /* Highlight action floating button */
    #highlight-btn {
      display: none;
      position: absolute;
      background: #fef08a;
      color: #854d0e;
      border: 1px solid #ca8a04;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      z-index: 100;
    }
    .hl-yellow {
      background-color: #fef08a;
    }

    /* Main Split Container */
    main {
      flex: 1;
      display: flex;
      padding: 10px;
      gap: 10px;
      overflow: hidden;
    }
    .pane {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 24px;
      overflow-y: auto;
      flex: 1;
      line-height: 1.6;
    }
    .passage-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #0b1a30;
    }
    .passage-body p {
      margin-bottom: 14px;
      font-size: 15px;
      text-align: justify;
    }

    /* Questions Pane */
    .q-instruction {
      background: #f1f5f9;
      padding: 10px 14px;
      border-left: 4px solid #0284c7;
      font-size: 13px;
      margin-bottom: 18px;
      font-weight: 500;
    }
    .q-item {
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px dashed #cbd5e1;
    }
    .q-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .q-options label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .q-options input[type="radio"] {
      margin-right: 8px;
    }
    .input-fill {
      border: 1px solid #94a3b8;
      border-radius: 3px;
      padding: 4px 8px;
      font-size: 14px;
      width: 140px;
      outline: none;
    }
    .input-fill:focus {
      border-color: #0284c7;
      background: #f0f9ff;
    }

    /* Footer: Bottom IELTS Navigation Bar */
    footer {
      background: #fff;
      border-top: 2px solid #cbd5e1;
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .q-matrix {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-height: 48px;
      overflow-y: auto;
    }
    .q-btn {
      width: 32px;
      height: 28px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #94a3b8;
      background: #f8fafc;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .q-btn.answered {
      background: #e2e8f0;
      text-decoration: underline;
    }
    .q-btn.review {
      border-color: #f59e0b;
      background: #fef3c7;
      color: #b45309;
    }
    .review-toggle-label {
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Results Modal */
    #score-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .modal-card {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      width: 440px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .score-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #0b1a30;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      margin: 16px auto;
    }
  </style>
</head>
<body>

  <!-- Highlight Toolbar -->
  <button id="highlight-btn" onclick="applyHighlight()">Highlight</button>

  <header>
    <div class="header-info">IELTS Academic Reading — Practice Test 1</div>

    <div style="display: flex; gap: 8px;">
      <a href="index.html" style="color: #fff; text-decoration: none; font-size: 13px; background: #374151; padding: 4px 10px; border-radius: 3px;">✍️ Writing</a>
      <a href="reading.html" style="color: #fff; text-decoration: none; font-size: 13px; background: #e02424; padding: 4px 10px; border-radius: 3px;">📖 Reading</a>
      <a href="listening.html" style="color: #fff; text-decoration: none; font-size: 13px; background: #374151; padding: 4px 10px; border-radius: 3px;">🎧 Listening</a>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <div class="timer-badge">
        Time: <span id="timer">60:00</span>
      </div>
      <button class="btn-submit" onclick="finishTest()">Finish Test</button>
    </div>
  </header>

  <div class="part-bar">
    <button class="part-btn active" id="tab-p1" onclick="switchPassage(1)">Part 1 (Questions 1–13)</button>
    <button class="part-btn" id="tab-p2" onclick="switchPassage(2)">Part 2 (Questions 14–26)</button>
    <button class="part-btn" id="tab-p3" onclick="switchPassage(3)">Part 3 (Questions 27–40)</button>
  </div>

  <main>
    <!-- Left: Reading Passage -->
    <section class="pane" id="passage-pane">
      <h2 class="passage-title" id="p-title">Reading Passage 1</h2>
      <div class="passage-body" id="p-body">
        <!-- Content will be injected by JavaScript -->
      </div>
    </section>

    <!-- Right: Questions -->
    <section class="pane" id="questions-pane">
      <div class="q-instruction">
        Answer the questions below based on Reading Passage 1. Highlight text in the passage to assist your reading.
      </div>
      <div id="q-list">
        <!-- Questions injected here -->
      </div>
    </section>
  </main>

  <footer>
    <div class="nav-controls">
      <span style="font-size: 13px; font-weight: bold;">Question Navigator:</span>
      <label class="review-toggle-label">
        <input type="checkbox" id="review-checkbox" onchange="toggleReview()">
        Review (Flag current question)
      </label>
    </div>
    <div class="q-matrix" id="q-buttons">
      <!-- 40 Question buttons will be generated here -->
    </div>
  </footer>

  <!-- Results Modal -->
  <div id="score-modal">
    <div class="modal-card">
      <h2>Reading Test Completed</h2>
      <div class="score-circle" id="band-val">0.0</div>
      <p id="raw-score-text" style="font-size: 15px; margin-bottom: 16px;">Raw Score: 0 / 40</p>
      <button class="btn-submit" onclick="closeModal()">Review Answers</button>
    </div>
  </div>

  <script>
    // 1. Data Store: Passages, Questions, Keys
    const examData = {
      p1: {
        title: "The Roman Water Management Systems",
        body: `
          <p>The Romans were renowned for their remarkable engineering achievements, among which aqueducts and sophisticated drainage systems held a pre-eminent position. Throughout the empire, subterranean pipes and elevated bridges carried millions of gallons of freshwater daily from distant springs into cities.</p>
          <p>Contrary to popular belief, the majority of aqueduct channels were constructed below ground rather than elevated on monumental stone arches. Underground conduits protected the water from contamination, reduced evaporation during hot Mediterranean summers, and minimized damage caused by hostile invaders.</p>
          <p>Distribution within urban centers was managed via complex reservoirs known as <em>castella</em>. From these storage tanks, lead and terracotta pipes channeled water directly to public baths, decorative fountains, and private villas belonging to wealthy patricians.</p>
        `,
        questions: [
          { id: 1, type: "choice", q: "1. Most aqueduct structures were constructed:", options: ["A. high on monumental arches", "B. beneath the ground level", "C. across wide natural lakes", "D. along defensive city walls"], key: "B" },
          { id: 2, type: "choice", q: "2. Underground channels primarily protected water from:", options: ["A. industrial waste", "B. high water pressure", "C. contamination and evaporation", "D. structural collapse"], key: "C" },
          { id: 3, type: "choice", q: "3. Urban water distribution was coordinated by reservoirs known as:", options: ["A. castella", "B. conduits", "C. arches", "D. terracotta"], key: "A" },
          { id: 4, type: "text", q: "4. Water was transported into private residences using lead and [.....] pipes.", key: "terracotta" }
        ]
      }
    };

    let userAnswers = {};
    let reviewFlags = {};
    let activeQuestion = 1;

    // 2. Render Passage & Questions
    function loadPassage() {
      const data = examData.p1;
      document.getElementById("p-title").innerText = data.title;
      document.getElementById("p-body").innerHTML = data.body;

      const qContainer = document.getElementById("q-list");
      qContainer.innerHTML = "";

      data.questions.forEach(item => {
        const div = document.createElement("div");
        div.className = "q-item";
        div.id = `question-block-${item.id}`;

        if (item.type === "choice") {
          let opts = item.options.map(opt => {
            const letter = opt[0];
            return `
              <label>
                <input type="radio" name="q_${item.id}" value="${letter}" onchange="recordAnswer(${item.id}, '${letter}')">
                ${opt}
              </label>
            `;
          }).join("");
          div.innerHTML = `<div class="q-title">${item.q}</div><div class="q-options">${opts}</div>`;
        } else {
          div.innerHTML = `
            <div class="q-title">${item.q}</div>
            <input type="text" class="input-fill" placeholder="Answer..." oninput="recordAnswer(${item.id}, this.value)">
          `;
        }
        qContainer.appendChild(div);
      });
    }

    // 3. Render 40 Navigation Buttons
    function renderNavButtons() {
      const container = document.getElementById("q-buttons");
      container.innerHTML = "";
      for (let i = 1; i <= 40; i++) {
        const btn = document.createElement("button");
        btn.className = "q-btn";
        btn.id = `q-btn-${i}`;
        btn.innerText = i;
        btn.onclick = () => scrollToQuestion(i);
        container.appendChild(btn);
      }
    }

    function recordAnswer(qId, val) {
      if (val.trim() !== "") {
        userAnswers[qId] = val.trim();
        document.getElementById(`q-btn-${qId}`).classList.add("answered");
      } else {
        delete userAnswers[qId];
        document.getElementById(`q-btn-${qId}`).classList.remove("answered");
      }
    }

    function toggleReview() {
      const isChecked = document.getElementById("review-checkbox").checked;
      reviewFlags[activeQuestion] = isChecked;
      const btn = document.getElementById(`q-btn-${activeQuestion}`);
      if (btn) {
        btn.classList.toggle("review", isChecked);
      }
    }

    function scrollToQuestion(qId) {
      activeQuestion = qId;
      document.getElementById("review-checkbox").checked = !!reviewFlags[qId];
      const target = document.getElementById(`question-block-${qId}`);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    // 4. In-text Highlighter
    const hlBtn = document.getElementById("highlight-btn");
    document.getElementById("passage-pane").addEventListener("mouseup", (e) => {
      const sel = window.getSelection();
      if (!sel.isCollapsed && sel.toString().trim().length > 0) {
        hlBtn.style.top = `${e.pageY - 35}px`;
        hlBtn.style.left = `${e.pageX}px`;
        hlBtn.style.display = "block";
      } else {
        hlBtn.style.display = "none";
      }
    });

    function applyHighlight() {
      const selection = window.getSelection();
      if (!selection.rangeCount) return;
      const range = selection.getRangeAt(0);
      const span = document.createElement("span");
      span.className = "hl-yellow";
      span.textContent = range.toString();
      range.deleteContents();
      range.insertNode(span);
      hlBtn.style.display = "none";
    }

    // 5. Timer (60:00)
    let totalSecs = 60 * 60;
    const timerElem = document.getElementById("timer");
    setInterval(() => {
      if (totalSecs <= 0) {
        finishTest();
        return;
      }
      totalSecs--;
      let m = Math.floor(totalSecs / 60).toString().padStart(2, '0');
      let s = (totalSecs % 60).toString().padStart(2, '0');
      timerElem.innerText = `${m}:${s}`;
    }, 1000);

    // 6. Calculate IELTS Band Score
    function convertToBand(raw) {
      if (raw >= 39) return "9.0";
      if (raw >= 37) return "8.5";
      if (raw >= 35) return "8.0";
      if (raw >= 33) return "7.5";
      if (raw >= 30) return "7.0";
      if (raw >= 27) return "6.5";
      if (raw >= 23) return "6.0";
      if (raw >= 19) return "5.5";
      if (raw >= 15) return "5.0";
      if (raw >= 13) return "4.5";
      return "4.0";
    }

    function finishTest() {
      let rawScore = 0;
      examData.p1.questions.forEach(item => {
        const studentAns = userAnswers[item.id];
        if (studentAns && studentAns.toLowerCase() === item.key.toLowerCase()) {
          rawScore++;
        }
      });

      const band = convertToBand(rawScore);
      document.getElementById("band-val").innerText = band;
      document.getElementById("raw-score-text").innerText = `Raw Score: ${rawScore} / 40 (Demo sample)`;
      document.getElementById("score-modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("score-modal").style.display = "none";
    }

    // Initialization
    loadPassage();
    renderNavButtons();
  </script>
</body>
</html>
